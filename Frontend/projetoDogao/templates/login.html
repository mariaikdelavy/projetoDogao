<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="login-body">

    <button class="login-voltar" onclick="window.location.href='index.html'" title="Voltar ao início">
        ←
    </button>

    <div class="login-container">

        <img src="/static/assets/logo.jpg" alt="Logo">

        <h2>Área Administrativa</h2>
        <p class="login-subtitulo">Acesso restrito</p>

        <div class="login-campo">
            <label>Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>

        <div class="login-campo">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha"
                onkeydown="if(event.key==='Enter') fazerLogin()">
        </div>

        <button class="btn-login" onclick="fazerLogin()">
            Entrar
        </button>

    </div>

    <script src="/static/js/script.js"></script>

</body>

</html>
