<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Carrinho</title>

    <link rel="stylesheet"
        href="/static/css/style.css">

</head>

<body onload="carregarCarrinho()">

    <header class="topo-carrinho">

        <button onclick="voltar()" title="Voltar">
            ←
        </button>

        <h2>Meu Carrinho</h2>

    </header>

    <main class="carrinho-container">

        <div id="itensCarrinho"></div>

        <div id="resumoTotal" class="resumo-total" style="display:none;">

            <div class="resumo-linha">
                <span>Subtotal</span>
                <span id="subtotal">R$ 0,00</span>
            </div>

            <div class="resumo-linha total-final">
                <span>Total</span>
                <span id="total">R$ 0,00</span>
            </div>

        </div>

        <div id="formularioSection" style="display:none;">

            <div class="formulario">

                <p class="secao-titulo">Seus dados</p>

                <div class="campo-grupo">
                    <label>Nome</label>
                    <input type="text"
                        id="nome"
                        placeholder="Seu nome completo">
                </div>

                <div class="campo-grupo">
                    <label>Telefone</label>
                    <input type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        oninput="mascaraTelefone(this)">
                    <span class="msg-erro" id="erroTelefone">
                        Informe um telefone válido.
                    </span>
                </div>

                <div class="campo-grupo">
                    <label>Forma de Pagamento</label>
                    <select id="formaPagamento">
                        <option value="PIX">PIX</option>
                        <option value="DINHEIRO">Dinheiro</option>
                        <option value="CARTAO">Cartão</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label>Tipo de Entrega</label>
                    <select id="tipoEntrega"
                        onchange="toggleEndereco(this)">
                        <option value="RETIRAR">Retirar no estabelecimento</option>
                        <option value="DELIVERY">Delivery</option>
                    </select>
                </div>

                <div class="campo-endereco" id="campoEndereco">

                    <p class="secao-titulo">Endereço de entrega</p>

                    <div class="campo-grupo">
                        <label for="cep">CEP</label>
                        <input type="text"
                            id="cep"
                            inputmode="numeric"
                            autocomplete="postal-code"
                            placeholder="00000-000"
                            maxlength="9"
                            oninput="mascaraCep(this)">
                        <span class="cep-status" id="statusCep"></span>
                    </div>

                    <div class="campo-grupo">
                        <label for="rua">Rua</label>
                        <input type="text"
                            id="rua"
                            autocomplete="address-line1"
                            placeholder="Nome da rua">
                    </div>

                    <div class="campo-linha">
                        <div class="campo-grupo campo-numero">
                            <label for="numero">Número</label>
                            <input type="text"
                                id="numero"
                                placeholder="Ex.: 123 ou S/N">
                        </div>

                        <div class="campo-grupo">
                            <label for="complemento">Complemento <small>(opcional)</small></label>
                            <input type="text"
                                id="complemento"
                                placeholder="Apto, bloco, referência">
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="bairro">Bairro</label>
                        <input type="text"
                            id="bairro"
                            placeholder="Bairro">
                    </div>

                    <div class="campo-linha">
                        <div class="campo-grupo">
                            <label for="cidade">Cidade</label>
                            <input type="text"
                                id="cidade"
                                autocomplete="address-level2"
                                placeholder="Cidade">
                        </div>

                        <div class="campo-grupo campo-uf">
                            <label for="uf">UF</label>
                            <input type="text"
                                id="uf"
                                maxlength="2"
                                placeholder="SC"
                                oninput="this.value=this.value.toUpperCase().replace(/[^A-Z]/g,'')">
                        </div>
                    </div>

                </div>

                <button class="btn-finalizar"
                    id="btnFinalizarPedido"
                    onclick="finalizarPedido()">
                    ✅ Finalizar Pedido
                </button>

            </div>

        </div>

    </main>

    <script src="/static/js/script.js"></script>

</body>

</html>
