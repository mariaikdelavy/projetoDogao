<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Painel Admin</title>

    <link rel="stylesheet"
        href="/static/css/style.css">

</head>

<body onload="carregarPedidosAdmin();">

    <header class="admin-topo">
<div class="topo-admin">

    <h1>Painel Administrativo</h1>

    <div class="acoes-admin">

        <button onclick="window.location.href='produtos.html'">
            Produtos
        </button>

        <button onclick="window.location.href='categorias.html'">
            Categorias
        </button>

        <button onclick="voltarInicio()">
            Início
        </button>

        <button onclick="sairAdmin()">
            Sair
        </button>

    </div>

</div>
    </header>

    <main class="admin-container">

        <section class="pedidos-admin">

            <div class="pedidos-cabecalho">

                <div class="pedidos-titulo-area">

                    <h2 id="tituloPedidos">Pedidos</h2>

                    <div class="pedidos-dia-nav">
                        <button type="button" onclick="mudarDiaPedidos(-1)" title="Dia anterior">‹</button>
                        <input type="date" id="filtroDia"
                            onchange="selecionarDiaPedidos(this.value)">
                        <button type="button" onclick="mudarDiaPedidos(1)" title="Próximo dia">›</button>
                        <button type="button" class="btn-hoje" onclick="irParaHojePedidos()">Hoje</button>
                    </div>

                </div>

                <div class="abas-pedidos" role="tablist">

                    <button type="button" role="tab" id="aba-espera"
                        class="aba-pedido ativa"
                        onclick="selecionarAbaPedidos('espera')">
                        Em espera <span class="aba-contador" id="contador-espera">0</span>
                    </button>

                    <button type="button" role="tab" id="aba-andamento"
                        class="aba-pedido"
                        onclick="selecionarAbaPedidos('andamento')">
                        Em andamento <span class="aba-contador" id="contador-andamento">0</span>
                    </button>

                    <button type="button" role="tab" id="aba-finalizados"
                        class="aba-pedido"
                        onclick="selecionarAbaPedidos('finalizados')">
                        Finalizados <span class="aba-contador" id="contador-finalizados">0</span>
                    </button>

                </div>

            </div>

            <div id="listaPedidos" class="caixa-pedidos"></div>

        </section>

    </main>

    <script src="/static/js/script.js"></script>

</body>

</html>
